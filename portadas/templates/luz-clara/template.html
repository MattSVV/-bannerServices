<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Playfair Display"; font-style: normal; font-weight: 400 900;
  src: url(../../assets/fonts/PlayfairDisplay-Variable.ttf) format("truetype"); }
@font-face { font-family: "Playfair Display"; font-style: italic; font-weight: 400 900;
  src: url(../../assets/fonts/PlayfairDisplay-Italic-Variable.ttf) format("truetype"); }
@font-face { font-family: "Outfit"; font-style: normal; font-weight: 100 900;
  src: url(../../assets/fonts/Outfit-Variable.ttf) format("truetype"); }

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1920px; height: 1080px; overflow: hidden; }
body {
  position: relative;
  background:
    radial-gradient(ellipse 700px 480px at 640px 620px, rgba(224, 178, 100, 0.28), rgba(224, 178, 100, 0) 70%),
    linear-gradient(180deg, #fbf6ec 0%, #f4ead8 100%);
  font-family: "Outfit", "Helvetica Neue", Arial, sans-serif;
  color: #4a3f35;
}
.label-row { position: absolute; left: 120px; top: 228px; height: 30px; display: flex; align-items: center; }
.label-row::before { content: ""; display: block; width: 72px; height: 2px; margin-right: 28px; background: #b07a2a; }
.label { font-size: 26px; font-weight: 600; letter-spacing: 0.28em; text-transform: uppercase; color: #9a6a1f; }
.icon-box { position: absolute; left: 104px; top: 340px; width: 224px; height: 224px; color: #9a6a1f; }
.icon-box svg { display: block; width: 100%; height: 100%; }
.title { position: absolute; left: 360px; top: 302px; width: 880px; line-height: 141px; font-family: "Playfair Display", Georgia, serif;
  font-size: 142px; letter-spacing: -0.01em; }
.title-main { font-weight: 600; color: #2b2118; }
.title-accent { font-style: italic; font-weight: 500; color: #b07a2a; }
.subtitle { position: absolute; left: 120px; top: 645px; width: 1000px; font-size: 44px; font-weight: 300; line-height: 58px; color: #5a4d40; }
.key-verse { position: absolute; left: 120px; top: 815px; font-size: 28px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: #9a6a1f; }
.divider { position: absolute; left: 1280px; top: 100px; width: 2px; height: 880px; background: rgba(120, 90, 40, 0.28); }
.readings-block { position: absolute; left: 1346px; top: 230px; width: 520px; }
.readings-label { height: 32px; font-size: 26px; font-weight: 600; letter-spacing: 0.28em; text-transform: uppercase; color: #9a6a1f; }
.readings { list-style: none; margin-top: 20px; }
.readings li { font-size: 32px; font-weight: 300; line-height: 58px; white-space: nowrap; color: #4a3f35; }

body.no-label .label-row, body.no-subtitle .subtitle, body.no-key-verse .key-verse, body.no-icon .icon-box { display: none; }
body.no-title-accent .title-accent { display: none; }
body.no-icon .title { left: 120px; }
body.no-readings .divider, body.no-readings .readings-block { display: none; }
body.no-readings-label .readings-label { display: none; }
</style>
</head>
<body class="{{empty_fields}}">
<div class="label-row"><span class="label">{{label}}</span></div>
<div class="icon-box">{{icon}}</div>
<div class="title"><div class="title-main">{{title_main}}</div><div class="title-accent">{{title_accent}}</div></div>
<div class="subtitle">{{subtitle}}</div>
<div class="key-verse">{{key_verse}}</div>
<div class="divider"></div>
<div class="readings-block"><div class="readings-label">{{readings_label}}</div><ul class="readings">{{readings}}</ul></div>
</body>
</html>

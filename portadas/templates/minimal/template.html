<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Outfit"; font-style: normal; font-weight: 100 900;
  src: url(../../assets/fonts/Outfit-Variable.ttf) format("truetype"); }

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1920px; height: 1080px; overflow: hidden; }
body { position: relative; background: #0a0a0a; color: #ffffff; font-family: "Outfit", "Helvetica Neue", Arial, sans-serif; }
.label { position: absolute; left: 120px; top: 96px; font-size: 28px; font-weight: 700; letter-spacing: 0.3em; text-transform: uppercase; color: #ffffff; }
.label::after { content: ""; display: block; width: 96px; height: 6px; margin-top: 20px; background: #ffffff; }
.icon-box { position: absolute; right: 120px; top: 84px; width: 120px; height: 120px; color: #ffffff; }
.icon-box svg { display: block; width: 100%; height: 100%; }
.title { position: absolute; left: 120px; top: 250px; width: 1500px; font-size: 168px; font-weight: 800; line-height: 164px; letter-spacing: -0.02em; text-transform: uppercase; }
.title-main { color: #ffffff; }
.title-accent { color: #8c8c8c; }
.subtitle { position: absolute; left: 120px; top: 622px; width: 1000px; font-size: 40px; font-weight: 300; line-height: 56px; color: #d0d0d0; }
.key-verse { position: absolute; left: 120px; top: 900px; font-size: 32px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #ffffff; }
.readings-block { position: absolute; left: 1240px; top: 500px; width: 560px; padding-left: 32px; border-left: 6px solid #ffffff; }
.readings-label { font-size: 24px; font-weight: 700; letter-spacing: 0.3em; text-transform: uppercase; color: #8c8c8c; }
.readings { list-style: none; margin-top: 14px; }
.readings li { font-size: 30px; font-weight: 400; line-height: 44px; white-space: nowrap; color: #ffffff; }

body.no-label .label, body.no-subtitle .subtitle, body.no-key-verse .key-verse, body.no-icon .icon-box { display: none; }
body.no-title-accent .title-accent { display: none; }
body.no-readings .readings-block { display: none; }
body.no-readings-label .readings-label { display: none; }
</style>
</head>
<body class="{{empty_fields}}">
<div class="label">{{label}}</div>
<div class="icon-box">{{icon}}</div>
<div class="title"><div class="title-main">{{title_main}}</div><div class="title-accent">{{title_accent}}</div></div>
<div class="subtitle">{{subtitle}}</div>
<div class="key-verse">{{key_verse}}</div>
<div class="readings-block"><div class="readings-label">{{readings_label}}</div><ul class="readings">{{readings}}</ul></div>
</body>
</html>
